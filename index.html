<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surco</title>
<meta name="description" content="Planeación, campo y cosecha del cultivo de papa">
<meta name="theme-color" content="#2c6b3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surco">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ec;--surface:#ffffff;--surface2:#e9e5d5;--ink:#14231a;--muted:#3f5446;--line:#bdb8a0;
  --accent:#1f6b3a;--accent-ink:#ffffff;--gold:#c08a1c;--bad:#a12a1a;--warn:#8f4300;--ok:#1f6b3a;--shade:rgba(20,35,26,.5);
  --f-head:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712;--surface:#17231b;--surface2:#223229;--ink:#eef3ea;--muted:#b6c6ba;--line:#4a5f50;
  --accent:#7cc18b;--accent-ink:#0d1a10;--gold:#e1b34e;--bad:#f59a8b;--warn:#f0bd6a;--ok:#7cc18b;--shade:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712;--surface:#17231b;--surface2:#223229;--ink:#eef3ea;--muted:#b6c6ba;--line:#4a5f50;
  --accent:#7cc18b;--accent-ink:#0d1a10;--gold:#e1b34e;--bad:#f59a8b;--warn:#f0bd6a;--ok:#7cc18b;--shade:rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;padding-inline:16px;padding-block:0 92px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;margin-bottom:10px}h2 small{font:500 12px var(--f-body);color:var(--muted);margin-left:4px}
h2.warn{color:var(--bad)}
p{margin:0 0 10px}
.fine{font-size:12.5px;color:var(--muted);line-height:1.45}.muted{color:var(--muted)}
.warnline{color:var(--warn)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
#app{max-width:760px;margin-inline:auto}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:10px;margin-inline:-16px;padding-inline:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:700 22px var(--f-head);letter-spacing:-.02em}
.brand .crop{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-top:3px}
.cyc{min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.cyc span{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
main{padding-block:6px 24px}
main>section{margin-block:20px}
.banner{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px}
#warnStore{background:color-mix(in srgb,var(--bad) 16%,var(--surface));border:1px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}

/* botones */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px}
.row.between{justify-content:space-between;align-items:center;flex-wrap:nowrap}
.row.between .fine{margin:0}
.row.between .btn{flex:none;white-space:nowrap}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick .btn{flex:1 1 130px}
.more{margin-top:10px}

/* cinta del ciclo */
.strip-wrap{margin-top:16px}
.strip{position:relative;display:flex;gap:3px;height:44px}
.seg{border-radius:22px 22px 4px 4px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-width:0}
.seg span{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:0 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.seg.past{background:color-mix(in srgb,var(--accent) 80%,var(--bg));border-color:var(--accent)}.seg.past span{color:var(--accent-ink)}
.seg.now{background:var(--gold);border-color:var(--gold)}.seg.now span{color:#201808}
.mark{position:absolute;top:-6px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.mark::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.strip-ticks{display:flex;justify-content:space-between;font:500 10px var(--f-mono);color:var(--muted);margin-top:6px}
.strip-line{margin:8px 0 2px}
@media(max-width:640px){.seg span{display:none}.strip-ticks span:nth-child(even){display:none}}

/* tarjetas numéricas */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stat .l{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat .n{font:700 21px/1.2 var(--f-head);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted)}
.stat.bad .n,.stat.bad .s{color:var(--bad)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.big{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.big .l{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.big b{font:700 34px/1.1 var(--f-head);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big b.neg{color:var(--bad)}.big b.pos{color:var(--ok)}
.big .s{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:10px 0}
.kv>div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;font:600 16px var(--f-head);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.phead h2{margin:0}
.params p{margin-bottom:6px}
.tot{display:flex;justify-content:space-between;padding:12px 4px;font-weight:600;border-top:2px solid var(--ink);margin-top:8px}

/* alertas y listas */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--muted);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alerts li span{font-size:13px;color:var(--muted)}
.alerts li.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.alerts li.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.alerts li.info{border-left-color:var(--accent)}
.list{display:grid;gap:8px}
.task{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 8px}
.task.late{border-left:4px solid var(--bad)}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.tbody{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;display:flex;flex-direction:column}
.tbody span{font-size:12.5px;color:var(--muted)}
.task.done .tbody b{text-decoration:line-through;color:var(--muted)}
.entry{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.entry.bad{border-left:4px solid var(--bad)}.entry.warn{border-left:4px solid var(--warn)}
.entry.cur{border-color:var(--accent)}
.entry .et{flex:1;min-width:0;display:flex;flex-direction:column}
.entry .et small{font-size:12.5px;color:var(--muted)}.entry .et .nota{font-style:italic}
.entry .ed{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.entry .ed small{font-size:12px;color:var(--muted)}
.entry .ed b{font-variant-numeric:tabular-nums}
.cyrow .ed{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.cyrow{margin-bottom:8px}
.cobro{align-items:center}
.pill{display:inline-block;font:600 11px var(--f-body);padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.tag{font-weight:500;color:var(--accent)}

/* subnavegación y chips */
.sub{display:flex;gap:4px;overflow-x:auto;margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.sub button.on{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
span.chip{display:inline-flex;align-items:center;min-height:30px}
.chip.soon{color:var(--muted);border-style:dashed}

/* presupuesto */
.cap{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.cap summary{display:grid;grid-template-columns:1fr auto 44px;gap:8px;align-items:center;padding:13px 14px;cursor:pointer;list-style:none;min-height:48px}
.cap summary::-webkit-details-marker{display:none}
.cap .cn{font-weight:600}.cap .cv{font:600 15px var(--f-head);font-variant-numeric:tabular-nums}.cap .cv small{font:400 11px var(--f-body);color:var(--muted)}
.cap .cp{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.cap[open] summary{border-bottom:1px solid var(--line)}
.line{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
.cap .lines .line:first-child{border-top:0}
.line .lc{flex:1;min-width:0}.line .lc small{display:block;color:var(--muted);font-size:12px}
.line .lv{font-variant-numeric:tabular-nums;font-weight:600}
.capfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:var(--surface2);font-size:12.5px}

/* tablas y gráficas */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;background:var(--surface2)}
.tbl td{text-align:right}.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal;min-width:110px}
.tbl tr:last-child td{border-bottom:0}
@media(max-width:480px){.tbl{font-size:12.5px}.tbl th,.tbl td{padding:8px 6px}.tbl th:first-child,.tbl td:first-child{min-width:84px}}
.tbl tr.cur td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.heat td{text-align:center;font-weight:600}.heat th:first-child{text-align:left;position:sticky;left:0}
.heat td.neg{background:color-mix(in srgb,var(--bad) 22%,var(--surface));color:var(--ink)}
.heat td.low{background:color-mix(in srgb,var(--gold) 28%,var(--surface));color:var(--ink)}
.heat td.pos{background:color-mix(in srgb,var(--ok) 24%,var(--surface));color:var(--ink)}
.cols{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.col{flex:1 0 62px;text-align:center;font-size:11.5px;display:flex;flex-direction:column;gap:3px}
.col b{font:600 12px var(--f-mono)}.col small{color:var(--muted);font-size:10.5px}
.colbar{height:96px;background:var(--surface2);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.colbar i{display:block;width:100%;background:var(--accent)}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:12px;border-bottom:2px solid var(--ink)}
.hist i{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:2px}
.hist i.neg{background:var(--bad)}.hist i.pos{background:var(--ok)}
.histax{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}.bar.over i{background:var(--bad)}
.cmp{margin-bottom:12px}.cmph{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}.cmph small{color:var(--muted);font-weight:400}

/* checklist */
.checks{display:grid;gap:8px}
button.chk{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
button.chk .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
button.chk.on .box{background:var(--accent);border-color:var(--accent)}
button.chk .ct{display:flex;flex-direction:column;min-width:0}.button.chk small,button.chk small{color:var(--muted);font-size:12.5px}

/* varios */
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty p{color:var(--muted);max-width:44ch;margin:0}
.src{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
.src li{display:flex;flex-direction:column;font-size:13.5px}.src li span{color:var(--muted);font-size:12.5px}
.closebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

/* extras v2 */
.banner.warn{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 45%,var(--line));margin-bottom:12px}
.tag.warn{color:var(--bad)}
.fold{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.fold summary{cursor:pointer;font:700 17px var(--f-head);padding:8px 0;list-style:none;min-height:44px;display:flex;align-items:center;gap:6px}
.fold summary::before{content:"▸";color:var(--muted);font-size:13px}.fold[open] summary::before{content:"▾"}
.fold summary small{font:500 12px var(--f-body);color:var(--muted)}
.fold .list{margin-top:8px}
.chips .fine{align-self:center;margin:0}
.entry.prod{align-items:center}
.entry.prod .et{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;min-width:0}
.entry.prod .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* bienvenida */
.welcome{margin-block:28px;display:flex;flex-direction:column;gap:14px}
.welcome h1{font-size:28px;line-height:1.15}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wl li{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px}
.wl li span{font-size:13.5px;color:var(--muted)}
.welcome .btn{align-self:flex-start}

/* formularios */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields h3{grid-column:1/-1;font-size:14px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);color:var(--accent)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font-size:12.5px;font-weight:600}.f>span em{font-style:normal;font-weight:400;color:var(--muted);margin-left:5px}
.f small{font-size:12px;color:var(--muted);line-height:1.35}
label.f.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;min-height:44px}
label.f.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
label.f.chk small{display:block}
input[type=text],input[type=date],select,textarea,input[type=file]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;min-height:44px}
textarea{resize:vertical;line-height:1.4}
input[type=file]{padding:8px}
.calc{margin-top:12px;font-size:13.5px;min-height:1.4em}
.calc:empty{display:none}
.calc b{font-variant-numeric:tabular-nums}
.err{margin-top:10px;color:var(--bad);font-weight:600;font-size:13.5px}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--shade)}
.sheet-box{position:relative;width:100%;max-width:600px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media(min-width:700px){#sheet{align-items:center}.sheet-box{border-radius:18px;max-height:88%}}
.sheet-box header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-box header h2{margin:0}
.sheet-box .x{width:40px;height:40px;font-size:26px;line-height:1;background:none;border:0;color:var(--muted)}
.sheet-box .intro{font-size:13px;color:var(--muted)}
.sheet-box footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--surface);padding-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}

/* navegación */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ===== UTILIDADES ===== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (n, d=0) => (isFinite(n) ? Number(n) : 0).toLocaleString('es-MX', {minimumFractionDigits:d, maximumFractionDigits:d});
const money = (n, d=0) => (n < 0 ? '−' : '') + '$' + fmtN(Math.abs(n), d);
const pct = (n, d=0) => fmtN(n, d) + '%';
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };

const DAY = 86400000;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const isoD = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => isoD(new Date(parseD(s).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((parseD(a).getTime() - parseD(b).getTime()) / DAY);
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD = s => { if (!s) return ''; const d = parseD(s); return d.getUTCDate() + ' ' + MESES[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear()).slice(2); };
const fmtM = s => { const [y, m] = s.split('-').map(Number); return MESES[m - 1] + ' ' + String(y).slice(2); };
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ===== CICLO ===== */
function newLines(cropId, ajuste, o) {
  const f = 1 + (ajuste || 0) / 100;
  const L = CROPS[cropId].lines.map(t => {
    const [cap, concepto, cant, unidad, veces, total, dds, nota, flag] = t;
    const pu = Math.round(total / (cant * veces) * f * 1e4) / 1e4;
    return {id: uid(), cap, concepto, cant, unidad, veces, pu, dds, nota: nota || '', rend: flag === 'rend', renta: flag === 'renta'};
  });

/* ===== PLAN ===== */
const lineCant = (l, c) => l.rend ? c.plan.rend.prob : l.cant;

/* ===== VIAJES (TRAILERS) ===== */

  <form class="sheet-box" id="sheetForm" role="dialog" aria-modal="true" aria-label="${esc(spec.title)}" novalidate>
    <header><h2>${esc(spec.title)}</h2><button type="button" class="x" data-a="sheetClose" aria-label="Cerrar">×</button></header>
    ${spec.intro ? `<p class="intro">${spec.intro}</p>` : ''}
    <div class="fields">${spec.fields.map(f => f.sep ? `<h3>${esc(f.sep)}</h3>` : fieldHTML(f, vals[f.k])).join('')}</div>
    <div id="sheetNote" class="calc"></div>
    <div id="sheetErr" class="err" hidden></div>
    <footer>${spec.onDelete ? `<button type="button" class="btn danger ghost" id="sheetDel">Borrar</button>` : '<span></span>'}
      <button type="submit" class="btn primary">${esc(spec.saveLabel || 'Guardar')}</button></footer>
  </form>`;
  $('#sheet').hidden = false; document.body.classList.add('lock');
  const form = $('#sheetForm');
  const upd = () => { if (spec.calc) $('#sheetNote').innerHTML = spec.calc(readSheet()); };
  form.addEventListener('input', upd); form.addEventListener('change', upd); upd();
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = readSheet();
    for (const f of spec.fields) if (f.req && (v[f.k] === '' || v[f.k] === undefined || (f.t === 'num' && !isFinite(v[f.k])))) {
      const er = $('#sheetErr'); er.textContent = 'Falta llenar: ' + f.l; er.hidden = false; $('#f_' + f.k).focus(); return;
    }
    const r = spec.onSave(v);
    if (r === false) return;
    if (r === 'keep') { commit(); return; }
    closeSheet(); commit();
  });
  const del = $('#sheetDel');
  if (del) del.addEventListener('click', () => {
    if (del.dataset.armed) { spec.onDelete(); closeSheet(); commit(); }
    else { del.dataset.armed = '1'; del.textContent = 'Toca de nuevo para borrar'; }
  });
  setTimeout(() => { const f = form.querySelector('input:not([type=checkbox]),select'); if (f && matchMedia('(min-width:700px)').matches) f.focus(); }, 60);
}
function readSheet() {
  const v = {};
  for (const f of SH.fields) {
    if (f.sep) continue;
    const el = $('#f_' + f.k); if (!el) continue;
    v[f.k] = f.t === 'chk' ? el.checked : f.t === 'num' ? (el.value.trim() === '' ? (f.req ? NaN : 0) : num(el.value)) : el.value.trim();
  }
  return v;
}

function stripHTML(c) {
  const E = CROPS[c.cultivo].etapas, total = E[E.length - 1].d1, d = dds(c), et = etapaDe(c, d);
  const left = Math.max(0, Math.min(100, d / total * 100));
  const segs = E.map((e, i) => `<div class="seg ${i < et.i ? 'past' : i === et.i ? 'now' : ''}" style="flex:${e.d1 - e.d0}"><span>${esc(e.n)}</span></div>`).join('');
  const sig = et.i >= 0 && et.i < E.length ? E[et.i + 1] : null;
  let line;
  if (d < 0) line = `Faltan <b>${-d}</b> ${-d === 1 ? 'día' : 'días'} para sembrar (${fmtD(c.fechaSiembra)}). Etapa actual: preparación.`;
  else if (et.i >= E.length) line = `Día <b>${d}</b> después de siembra. El ciclo de campo ya terminó, toca cobrar y cerrar.`;
  else line = `Día <b>${d}</b> después de siembra · <b>${esc(et.n)}</b>${sig ? ` · sigue ${esc(sig.n.toLowerCase())} en ${E[et.i].d1 - d} ${E[et.i].d1 - d === 1 ? 'día' : 'días'}` : ''}`;
  return `<section class="strip-wrap" aria-label="Etapas del cultivo">
    <div class="strip">${segs}<div class="mark" style="left:${left}%" aria-hidden="true"><i></i></div></div>
    <div class="strip-ticks"><span>Siembra</span><span>Día ${E[2].d0}</span><span>Día ${E[3].d0}</span><span>Día ${E[4].d0}</span><span>Día ${E[5].d0}</span><span>Día ${total}</span></div>
    <p class="strip-line">${line}</p>
    <p class="fine">Las etapas son aproximadas. Cambian con la fecha de siembra y la variedad.</p>
  </section>`;
}
VIEWS.hoy = c => {
  const k = planCalc(c), g = gastosCalc(c), co = cosechaCalc(c), d = dds(c), A = alertas(c);
  const off = c.catOff || {};
  const pend = c.tasks.filter(t => !t.done && !off[t.cat]).map(t => ({...t, f: addDays(c.fechaSiembra, t.dds)})).sort((a, b) => a.dds - b.dds);
  const hoy = todayISO();
  const prox = pend.filter(t => t.f <= addDays(hoy, 7) && t.f >= (c.creado || '') && t.dds >= -45).slice(-7);
  const tareas = prox.length ? prox.map(t => taskRow(c, t, hoy)).join('') : `<p class="muted">No hay tareas pendientes para esta semana.</p>`;
  const presup = k.directo * c.ha;
  return `${stripHTML(c)}
  <section class="stats">
    ${stat('Gastado', money(g.tot), `de ${money(presup)} presupuestados`)}
    ${stat('Cosechado', co.ton ? fmtN(co.ton, 1) + ' t' : '0 t', `de ${fmtN(k.tonEsp, 0)} t esperadas`)}
    ${stat('Por cobrar', money(co.porCobrar), co.vencido ? `${money(co.vencido)} vencido` : (co.n ? 'al corriente' : 'sin ventas aún'), co.vencido ? 'bad' : '')}
    ${stat('Utilidad esperada', money(k.utilidadHa * c.ha), `${money(k.utilidadHa)} por ha`, k.utilidadHa < 0 ? 'bad' : '')}
  </section>
  <section class="quick">
    ${btn('+ Gasto', 'addGasto', '', 'primary')}${btn('+ Riego o aplicación', 'addBitMenu')}${btn('+ Trailer', 'addViaje')}
  </section>
  <section><h2>Atención</h2>
    ${A.length ? `<ul class="alerts">${A.map(a => `<li class="${a.s}"><b>${esc(a.t)}</b><span>${esc(a.d)}</span></li>`).join('')}</ul>` : `<p class="muted">Sin alertas por ahora.</p>`}
  </section>
  <section><h2>Esta semana</h2><div class="list">${tareas}</div>
    <p class="more">${btn('Ver calendario completo', 'go', 'data-tab="campo" data-sub="calendario"', 'ghost')}</p>
  </section>`;
};
function taskRow(c, t, hoy) {
  const f = t.f || addDays(c.fechaSiembra, t.dds), late = !t.done && f < hoy;
  return `<div class="task ${t.done ? 'done' : ''} ${late ? 'late' : ''}">
    <button type="button" class="check" data-a="toggleTask" data-id="${t.id}" aria-label="${t.done ? 'Marcar pendiente' : 'Marcar hecha'}" aria-pressed="${t.done}">${t.done ? '✓' : ''}</button>

      <span>${esc(t.cat)} · ${late ? 'venció el ' : ''}${fmtD(f)}${t.dds === 0 ? ' (siembra)' : ''}${t.done && t.doneDate ? ' · hecha el ' + fmtD(t.doneDate) : ''}</span>

}

    <div class="big"><span class="l">Costo por hectárea</span><b>${money(k.costoHa)}</b><span class="s">${k.faltan ? '<b class="neg">Incompleto, faltan conceptos por cotizar.</b> ' : ''}${money(k.costoTotal)} en ${fmtN(c.ha, c.ha % 1 ? 1 : 0)} ha${k.fin > 0 ? ` · incluye ${money(k.fin)}/ha de intereses` : ''}</span></div>
    <dl class="kv">
      <div><dt>Rendimiento esperado</dt><dd>${fmtN(p.rend.prob, 1)} t/ha</dd></div>

};
function lineRow(c, l) {

PLAN_VIEWS.capital = c => {

};

PLAN_VIEWS.riesgo = c => {

    <p class="fine">Cada simulación toma un rendimiento (entre ${p.rend.min} y ${p.rend.max} t/ha), un precio (${p.varPrecio.min}% a +${p.varPrecio.max}% sobre el promedio) y un costo (${p.varCosto.min}% a +${p.varCosto.max}%), y con ${p.evento.prob}% de probabilidad un evento como helada, granizo o plaga fuerte que quita ${p.evento.perdida}% del rendimiento. Los porcentajes de variación y del evento son estimaciones iniciales, ajústalos a tu experiencia.</p></section>
  <section><h2>Si cambia el destino de venta</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Destino</th><th>$/t promedio</th><th>Utilidad/ha</th></tr></thead><tbody>
    ${[['Tu mezcla actual', c.plan.clases], ...Object.values(DESTINOS).map(d => [d.n, Object.fromEntries(Object.keys(CLASES).map(q => [q, {pct: d.mix[q], precio: c.plan.clases[q].precio}]))])].map(([n, cl]) => { const q = planCalc({...c, plan: {...c.plan, clases: cl}}); return `<tr><td>${esc(n)}</td><td>${money(q.precioProm)}</td><td class="${q.utilidadHa < 0 ? 'neg' : 'pos'}">${money(q.utilidadHa)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="fine">Por si el contrato con la industria se cae o te regresan papa, como pasó en 2025 en el norte de Sinaloa. Cada fila vende toda la cosecha con esa mezcla, con tus precios por calidad.</p></section>
  <section><h2>Utilidad por hectárea según rendimiento y precio</h2>
    <div class="tblwrap"><table class="tbl heat"><thead><tr><th>t/ha \\ $/t</th>${sn.cols.map(x => `<th>${fmtN(x, 0)}</th>`).join('')}</tr></thead><tbody>

/* ====================== CIERRE ====================== */
function realCalc(c) {
  const co = cosechaCalc(c), g = gastosCalc(c), ha = c.ha || 1;
  return {co, g, tonHa: co.ton / ha, costoHa: g.tot / ha, costoTon: co.ton ? g.tot / co.ton : 0,
          util: co.ing - g.tot, utilHa: (co.ing - g.tot) / ha, ing: co.ing};
}
const difk = (r, p, b) => dif(r, p, b, 'k');
const dif = (real, plan, bajaEsMejor, suf = '') => {
  const d = real - plan, bien = bajaEsMejor ? d <= 0 : d >= 0;
  return `<span class="${Math.abs(d) < 1e-9 ? '' : bien ? 'pos' : 'neg'}">${d > 0 ? '+' : d < 0 ? '−' : ''}${fmtN(Math.abs(d), Math.abs(d) < 100 ? 1 : 0)}${suf}</span>`;
};
VIEWS.cierre = c => {
  const k = planCalc(c), r = realCalc(c), co = r.co, p = c.plan;
  const parcial = !c.cerrado && co.ton < k.tonEsp * 0.9, cmpC = c.cerrado || co.n > 0;
  const planUtil = k.utilidadHa * c.ha;
  const rows = [
    ['Rendimiento (t/ha)', fmtN(p.rend.prob, 1), co.ton ? fmtN(r.tonHa, 1) : '—', co.ton ? dif(r.tonHa, p.rend.prob) : ''],
    ['Precio neto ($/kg)', fmtN(k.precioProm / 1000, 2), co.ton ? fmtN(co.precioKg, 2) : '—', co.ton ? dif(co.precioKg, k.precioProm / 1000) : ''],
    ['Ingresos', money(k.ingresoHa * c.ha), co.n ? money(r.ing) : '—', co.n ? difk(Math.round(r.ing / 1000), Math.round(k.ingresoHa * c.ha / 1000)) : ''],
    ['Costos', money(k.costoTotal), r.g.tot ? money(r.g.tot) : '—', r.g.tot && cmpC ? difk(Math.round(r.g.tot / 1000), Math.round(k.costoTotal / 1000), true) : ''],
    ['Costo por ha', money(k.costoHa), r.g.tot ? money(r.costoHa) : '—', r.g.tot && cmpC ? difk(Math.round(r.costoHa / 1000), Math.round(k.costoHa / 1000), true) : ''],
    ['Costo por tonelada', money(k.costoTotal / (k.tonEsp || 1)), co.ton && r.g.tot ? money(r.costoTon) : '—', co.ton && r.g.tot && cmpC ? difk(Math.round(r.costoTon / 100) / 10, Math.round(k.costoTotal / (k.tonEsp || 1) / 100) / 10, true) : ''],
    ['Utilidad', money(planUtil), co.n ? money(r.util) : '—', co.n ? difk(Math.round(r.util / 1000), Math.round(planUtil / 1000)) : '']
  ];
  const capRows = CAPS.filter(([id]) => (id !== 'tierra' || c.tenencia === 'renta')).map(([id, n]) => {
    const pl = (k.byCap[id] || 0) * c.ha + (id === 'financiero' ? k.fin * c.ha : 0), re = r.g.by[id] || 0;
    if (!pl && !re) return '';
    return `<tr><td>${esc(n)}</td><td>${money(pl)}</td><td>${re ? money(re) : '—'}</td><td>${re && cmpC ? difk(Math.round(re / 1000), Math.round(pl / 1000), true) : ''}</td></tr>`;
  }).join('');
  const otros = S.cycles.filter(x => x.cultivo === c.cultivo && (x.viajes.length || x.gastos.length));
  const nc = c.notasCierre || {};
  const heroK = !co.n ? '' : r.util >= 0 ? 'pos' : 'neg';
  return `<section class="summary"><div class="big"><span class="l">${c.cerrado ? 'Resultado final del ciclo' : 'Resultado a la fecha'}</span>
    <b class="${heroK}">${co.n ? money(r.util) : 'Sin ventas aún'}</b>
    <span class="s">${co.n ? `${money(r.utilHa)} por hectárea · el plan decía ${money(k.utilidadHa)}` : 'Registra tus trailers y tus gastos para ver cómo cerró el ciclo.'}</span></div>
    ${c.cerrado ? `<p>${pill('Ciclo cerrado', 'ok')}</p>` : ''}
    ${parcial && co.n ? `<p class="fine warnline">Este resultado es parcial: llevas ${fmtN(co.ton / (k.tonEsp || 1) * 100, 0)}% de las toneladas esperadas.</p>` : ''}
    ${!r.g.tot && co.n ? `<p class="fine warnline">No has registrado gastos, por eso la utilidad sale inflada. Anota los gastos reales en Campo, pestaña Gastos.</p>` : ''}
    </section>
  <section><h2>Plan contra realidad</h2>
    <div class="tblwrap"><table class="tbl cmpt"><thead><tr><th></th><th>Plan</th><th>Real</th><th>Dif.</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td><td><b>${x[2]}</b></td><td>${x[3]}</td></tr>`).join('')}</tbody></table></div>
    <p class="fine">El ingreso real ya descuenta castigos, comisión y flete de cada boleta. El costo real es lo que registraste en Gastos, incluidos los intereses si los anotaste.</p></section>
  <section><h2>Costos por capítulo</h2>

    ${[['bien', '¿Qué salió bien?'], ['mal', '¿Qué salió mal?'], ['cambio', '¿Qué harías distinto el próximo ciclo?']].map(([id, l]) => `<label class="f full"><span>${l}</span><textarea rows="3" data-c="notaCierre" data-k="${id}">${esc(nc[id] || '')}</textarea></label>`).join('')}

  <section class="closebox"><h2>${c.cerrado ? 'Ciclo cerrado' : 'Cerrar el ciclo'}</h2>
    <p class="fine">${c.cerrado ? 'Puedes reabrirlo si te falta registrar algo.' : (co.porCobrar > 0 ? `Todavía te deben ${money(co.porCobrar)}. Cierra cuando cobres el último trailer.` : 'Cuando hayas vendido y cobrado todo, ciérralo. Quedará guardado para comparar contra tus próximos ciclos.')}</p>
    <div class="row">${btn(c.cerrado ? 'Reabrir ciclo' : 'Marcar ciclo como cerrado', 'cerrar', '', c.cerrado ? 'ghost' : 'primary')}</div>
    <div class="row">${btn('Exportar gastos (CSV)', 'csvGastos', '', 'ghost sm')}${btn('Exportar trailers (CSV)', 'csvViajes', '', 'ghost sm')}</div>
    <p class="fine">Los CSV se abren en Excel o en Hojas de cálculo. Sirven para pasárselos a tu contador o al banco.</p>
  </section>`;
};

    credito: p.credito, pctFin: p.pctFin, tasa: p.tasa, venceDias: p.venceDias, diasPago: p.diasPago};
  K.forEach(k => { vals['pc_' + k] = p.clases[k].pct; vals['pr_' + k] = p.clases[k].precio; });
  openSheet({
    title: 'Supuestos del ciclo', fields: F, values: vals,
    calc: v => {
      const s = K.reduce((a, k) => a + (v['pc_' + k] || 0), 0), pm = K.reduce((a, k) => a + (v['pc_' + k] || 0) * (v['pr_' + k] || 0), 0) / (s || 1);
      return `La mezcla suma <b>${fmtN(s, 0)}%</b>${Math.abs(s - 100) > .5 && !v.preset ? ' <span class="neg">(debe sumar 100)</span>' : ''} · precio promedio <b>${money(pm)}/t</b>`;
    },
    onSave(v) {
      if (!(v.ha > 0)) return sheetErr('Las hectáreas deben ser mayores que cero.');
      if (!(v.rmin > 0 && v.rmin <= v.rprob && v.rprob <= v.rmax)) return sheetErr('El rendimiento debe cumplir: malo ≤ normal ≤ bueno.');
      if (v.preset) K.forEach(k => v['pc_' + k] = DESTINOS[v.preset].mix[k]);
      const s = K.reduce((a, k) => a + v['pc_' + k], 0);
      if (Math.abs(s - 100) > .5) return sheetErr('Los porcentajes de venta deben sumar 100. Ahora suman ' + fmtN(s, 0) + '.');
      c.nombre = v.nombre; c.ha = v.ha; c.variedad = v.variedad; c.fechaSiembra = v.fechaSiembra; c.tenencia = v.tenencia;
      p.rend = {min: v.rmin, prob: v.rprob, max: v.rmax};
      K.forEach(k => p.clases[k] = {pct: v['pc_' + k], precio: v['pr_' + k]});
      p.credito = v.credito; p.pctFin = Math.min(100, Math.max(0, v.pctFin)); p.tasa = Math.max(0, v.tasa);
      p.venceDias = Math.max(30, Math.round(v.venceDias) || 270); p.diasPago = Math.max(0, Math.round(v.diasPago));
      if (v.preset) c.destino = v.preset;
    }
  });
}

function gastoSheet(c, g) {
  openSheet({
    title: g ? 'Gasto' : 'Registrar gasto',
    fields: [
      {k: 'fecha', l: 'Fecha', t: 'date', req: 1},
      {k: 'cap', l: 'Capítulo', t: 'sel', o: selCap},
      {k: 'concepto', l: 'Qué se pagó', req: 1, w: 'full', h: 'Ej. Urea, diésel del barbecho, jornales de siembra.'},
      {k: 'monto', l: 'Monto', t: 'num', req: 1, u: '$'},

      return bud ? `${esc(CAP_NAME[v.cap])}: con este gasto llevas <b>${money(real)}</b> de <b>${money(bud)}</b> presupuestados (${pct(real / bud * 100)}).` : '';

const CLASES_APL = ['Fungicida', 'Insecticida', 'Herbicida', 'Fertilizante foliar', 'Fertilizante al suelo', 'Fertirriego', 'Regulador o desvare', 'Otro'];
function bitSheet(c, tipo, b) {

  if (tipo === 'riego') {
    titulo = 'Riego';
    F = [{k: 'fecha', l: 'Fecha', t: 'date', req: 1}, {k: 'metodo', l: 'Método', t: 'sel', o: sel(METODOS_RIEGO)}, {k: 'horas', l: 'Horas de riego', t: 'num'}, {k: 'lamina', l: 'Lámina aplicada', t: 'num', u: 'mm', h: 'Si no la mides, déjala en blanco.'},
      {k: 'costo', l: 'Costo del riego', t: 'num', u: '$', h: 'Energía, diésel o cuota de este riego.'}, {k: 'gasto', l: 'Anotar este costo también en Gastos', t: 'chk'}, {k: 'nota', l: 'Nota', t: 'area', w: 'full'}];
    vals = b ? {...b, gasto: false} : {fecha: todayISO(), metodo: 'Aspersión', horas: '', lamina: '', costo: '', gasto: true, nota: ''};
  } else if (tipo === 'aplicacion') {
    titulo = 'Aplicación';
    const inv = extraOn('inv') ? (S.inv || []) : [];
    const prevNames = [...new Set(S.cycles.flatMap(x => x.bitacora).filter(x => x.tipo === 'aplicacion' && x.producto).map(x => x.producto))];
    F = [{k: 'fecha', l: 'Fecha', t: 'date', req: 1},
      ...(inv.length ? [{k: 'inv', l: 'Producto del almacén', t: 'sel', w: 'full', o: [['', 'Otro (escribo el nombre)'], ...inv.map(p => [p.id, p.nombre + ' (' + fmtN(p.existencia, 1) + ' ' + p.unidad + ')'])]}, {k: 'cantU', l: 'Cantidad usada', t: 'num', h: 'En la unidad del producto. Se descuenta del almacén.'}] : []),
      {k: 'producto', l: 'Producto', w: 'full', dl: prevNames, h: inv.length ? 'Si elegiste uno del almacén, puedes dejarlo en blanco.' : 'Si ya lo usaste antes, la carencia se llena sola.'},
      {k: 'carencia', l: 'Carencia', t: 'num', u: 'días', h: 'Días mínimos entre esta aplicación y la cosecha. Está en la etiqueta. Si no tiene, pon 0. Con esto la app te avisa cuándo ya puedes cosechar.'},
      {k: 'clase', l: 'Tipo', t: 'sel', o: sel(CLASES_APL)}, {k: 'objetivo', l: 'Para qué (plaga, enfermedad, nutriente)'},
      {k: 'dosis', l: 'Dosis por ha'}, {k: 'metodo', l: 'Cómo se aplicó', t: 'sel', o: sel(['Terrestre', 'Aérea', 'Fertirriego', 'Voleo', 'Otro'])},
      {k: 'costo', l: 'Costo total', t: 'num', u: '$'}, {k: 'gasto', l: 'Anotar este costo también en Gastos', t: 'chk'}, {k: 'nota', l: 'Nota', t: 'area', w: 'full'}];
    vals = b ? {...b, gasto: false, inv: b.inv || '', cantU: b.cantU || ''} : {fecha: todayISO(), inv: '', cantU: '', producto: '', clase: 'Fungicida', objetivo: '', dosis: '', metodo: 'Terrestre', carencia: 0, costo: '', gasto: true, nota: ''};
  } else if (tipo === 'monitoreo') {
    titulo = 'Monitoreo';
    F = [{k: 'fecha', l: 'Fecha', t: 'date', req: 1}, {k: 'motivo', l: 'Qué revisaste', req: 1, w: 'full', h: 'Ej. Paratrioza en trampas, tizón tardío, emergencia, humedad del suelo.'},
      {k: 'nivel', l: 'Nivel', t: 'sel', o: [['bajo', 'Bajo'], ['medio', 'Medio'], ['alto', 'Alto, hay que actuar']]}, {k: 'dato', l: 'Dato (conteo, lectura, %)'}, {k: 'nota', l: 'Nota', t: 'area', w: 'full'}];
    vals = b ? {...b} : {fecha: todayISO(), motivo: '', nivel: 'bajo', dato: '', nota: ''};
  } else {
    titulo = 'Nota';
    F = [{k: 'fecha', l: 'Fecha', t: 'date', req: 1}, {k: 'nota', l: 'Nota', t: 'area', req: 1, w: 'full'}];
    vals = b ? {...b} : {fecha: todayISO(), nota: ''};
  }
  openSheet({
    title: (b ? '' : 'Nuevo: ') + titulo.toLowerCase(), fields: F, values: vals,
    calc: tipo === 'aplicacion' ? v => { const p = v.inv ? byId(S.inv || [], v.inv) : null; if (!p) return ''; const antes = p.existencia + (b && b.inv === p.id ? (b.cantU || 0) : 0), q = antes - (v.cantU || 0); return `Quedarían <b>${fmtN(q, 1)} ${esc(p.unidad)}</b> en el almacén${q < 0 ? ' <span class="neg">(más de lo que hay)</span>' : ''}${p.carencia ? ' · carencia del producto: ' + p.carencia + ' d' : ''}.`; } : null,
    onSave(v) {
      const o = b || {id: uid(), tipo};
      let { gasto, ...rest } = v;
      if (tipo === 'aplicacion') {
        const prod = v.inv ? byId(S.inv || [], v.inv) : null;
        if (!prod && !v.producto) return sheetErr('Falta el producto.');
        if (b && b.inv && b.cantU) { const pp = byId(S.inv || [], b.inv); if (pp) pp.existencia += b.cantU; }
        if (prod) {
          if (!rest.producto) rest.producto = prod.nombre;
          if (!rest.carencia && prod.carencia) rest.carencia = prod.carencia;
          if (!rest.costo && prod.costoU && v.cantU) rest.costo = Math.round(v.cantU * prod.costoU);
          if (v.cantU) prod.existencia = Math.max(0, prod.existencia - v.cantU);
          gasto = false; v.gasto = false;
        } else {
          rest.inv = ''; rest.cantU = 0;
          if (!rest.carencia) {
            const nm = String(v.producto).trim().toLowerCase();
            const prev = S.cycles.flatMap(x => x.bitacora).filter(x => x.tipo === 'aplicacion' && x.carencia > 0 && String(x.producto || '').trim().toLowerCase() === nm).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
            if (prev) rest.carencia = prev.carencia;
          }
        }
      }
      Object.assign(o, rest);
      if (tipo === 'riego') { o.tipo = 'riego'; }
      if (!b) c.bitacora.push(o);
      if (gasto && v.costo > 0) {
        const cap = tipo === 'riego' ? 'riego' : /fertil/i.test(v.clase) ? 'fert' : 'plagas';
        c.gastos.push({id: uid(), fecha: v.fecha, cap, concepto: tipo === 'riego' ? 'Riego (' + v.metodo + ')' : v.producto, monto: v.costo, proveedor: ''});
      }
    },
    onDelete: b ? () => { if (b.inv && b.cantU) { const pp = byId(S.inv || [], b.inv); if (pp) pp.existencia += b.cantU; } c.bitacora = c.bitacora.filter(x => x !== b); } : null
  });
}

  if (ARMED !== k) { ARMED = k; render(); return; }
  ARMED = ''; S.cycles = S.cycles.filter(x => x.id !== el.dataset.id);
  if (!S.cycles.find(x => x.id === S.activeId)) S.activeId = S.cycles[0] ? S.cycles[0].id : null;
  commit(); toast('Ciclo borrado');
};
ACT.wipe = () => {
  if (ARMED !== 'wipe') { ARMED = 'wipe'; render(); return; }
  ARMED = ''; S.cycles = []; S.activeId = null; S.ui.tab = 'hoy'; commit({top: true}); toast('Se borró todo');
};
ACT.extra = el => { S.ui.extras = S.ui.extras || {}; const k = el.dataset.id; S.ui.extras[k] = !extraOn(k); if (!S.ui.extras[k]) S.ui.sub.campo = 'calendario'; commit(); };
ACT.theme = () => { const o = ['auto', 'light', 'dark']; S.ui.theme = o[(o.indexOf(S.ui.theme || 'auto') + 1) % 3]; applyTheme(); commit(); };
function applyTheme() { const t = S.ui.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

CHG.notaCierre = el => { const c = cyc(); if (!c) return; c.notasCierre = c.notasCierre || {}; c.notasCierre[el.dataset.k] = el.value; save(); };
CHG.importFile = el => {
  const f = el.files && el.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(String(r.result)); r.onerror = () => toast('No pude leer el archivo'); r.readAsText(f);
};
ACT.importPaste = () => { const t = ($('#impTxt') || {}).value || ''; if (!t.trim()) { toast('Pega primero el texto del respaldo'); return; } importText(t); };
function importText(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { toast('Ese texto no es un respaldo válido'); return; }
  const arr = o && Array.isArray(o.cycles) ? o.cycles : null;
  if (!arr || !arr.every(x => x && x.id && x.lines && x.tasks && x.fechaSiembra)) { toast('El respaldo no tiene el formato de Surco'); return; }
  for (const x of arr) { const i = S.cycles.findIndex(y => y.id === x.id); if (i >= 0) S.cycles[i] = x; else S.cycles.push(x); }
  if (Array.isArray(o.inv)) { S.inv = S.inv || []; for (const p of o.inv) { const i = S.inv.findIndex(y => y.id === p.id); if (i >= 0) S.inv[i] = p; else S.inv.push(p); } }
  if (!S.cycles.find(x => x.id === S.activeId)) S.activeId = arr[0].id;
  commit(); toast(arr.length + (arr.length === 1 ? ' ciclo restaurado' : ' ciclos restaurados'));
}

/* Guardar archivos con la capacidad "downloads" del visor */
function blobDownload(filename, data) {
  const type = /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function saveFile(filename, data, okMsg) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl && window.STANDALONE) { blobDownload(filename, data); toast(okMsg); return true; }
  if (!dl) return false;
  try { await dl.save({filename, data}); toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === 'declined') return true;
    if (code === 'rate_limited') toast('Espera un momento y vuelve a intentar');
    else toast('No se pudo guardar el archivo aquí');
    return true;
  }
}
async function copyText(t, okMsg) {
  try { await navigator.clipboard.writeText(t); toast(okMsg); }
  catch (e) { const ta = $('#impTxt'); if (ta) { ta.value = t; ta.select(); toast('Selecciona y copia el texto'); } else toast('Tu navegador no deja copiar aquí'); }
}
ACT.backup = async () => {
  const txt = JSON.stringify(S, null, 1);
  const ok = await saveFile('surco-respaldo-' + todayISO() + '.json', txt, 'Respaldo guardado');
  if (!ok) { await copyText(txt, 'No puedo descargar aquí. Copié el respaldo: pégalo en un archivo de notas.'); }
};
ACT.copyBackup = () => copyText(JSON.stringify(S), 'Respaldo copiado. Pégalo en un lugar seguro.');
const csvCell = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
const csvOut = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
ACT.csvGastos = async () => {
  const c = cyc(), rows = [['Fecha', 'Capítulo', 'Concepto', 'Proveedor', 'Monto']];
  [...c.gastos].sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(g => rows.push([g.fecha, CAP_NAME[g.cap], g.concepto, g.proveedor, g.monto]));
  if (!(await saveFile('gastos-' + c.nombre.replace(/[^\w\-]+/g, '_') + '.csv', csvOut(rows), 'Gastos exportados'))) toast('La descarga no está disponible en esta vista');
};
ACT.csvViajes = async () => {
  const c = cyc(), rows = [['Fecha', 'Comprador', 'Destino', 'Boleta', 'Calidad', 'Kg netos', 'Precio por kg', 'Castigo %', 'Comisión %', 'Flete', 'Neto a recibir', 'Fecha de pago', 'Cobrado']];
  [...c.viajes].sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(v => { const x = viajeCalc(v); rows.push([v.fecha, v.comprador, v.destino, v.folio, v.calidad, Math.round(x.kg), v.precioKg, v.desc, v.com, v.flete, Math.round(x.neto$), v.fechaPago, v.pagado ? 'Sí' : 'No']); });
  if (!(await saveFile('trailers-' + c.nombre.replace(/[^\w\-]+/g, '_') + '.csv', csvOut(rows), 'Trailers exportados'))) toast('La descarga no está disponible en esta vista');
};


function contratoSheet(c, x) {
  openSheet({
    title: x ? 'Contrato' : 'Registrar contrato',
    intro: 'Escribe el comprador igual que lo vas a escribir en los trailers, para que se cuenten las entregas.',
    fields: [
      {k: 'comprador', l: 'Comprador', req: 1, w: 'full', dl: [...new Set(c.viajes.map(v => v.comprador).filter(Boolean))]},
      {k: 'ton', l: 'Toneladas pactadas', t: 'num', req: 1, u: 't'}, {k: 'precioKg', l: 'Precio pactado', t: 'num', u: '$/kg', h: 'Déjalo en blanco si el precio es abierto.'},
      {k: 'fecha', l: 'Fecha de entrega aproximada', t: 'date'}, {k: 'cancelado', l: 'Se canceló o me regresaron la papa', t: 'chk'},
      {k: 'cond', l: 'Condiciones', t: 'area', w: 'full', h: 'Calidad o tamaño mínimo, castigos, plazo de pago, quién paga el flete.'}
    ],
    values: x ? {...x} : {comprador: '', ton: '', precioKg: '', fecha: '', cancelado: false, cond: ''},
    calc: v => v.ton > 0 && v.precioKg > 0 ? `Valor del contrato: <b>${money(v.ton * 1000 * v.precioKg)}</b> (${fmtN(v.ton / (c.ha || 1), 1)} t por hectárea de tu lote).` : '',
    onSave(v) { if (!(v.ton > 0)) return sheetErr('Falta el tonelaje.'); const o = x || {id: uid()}; Object.assign(o, v); c.contratos = c.contratos || []; if (!x) c.contratos.push(o); },
    onDelete: x ? () => { c.contratos = c.contratos.filter(y => y !== x); } : null
  });
}
ACT.addContrato = () => contratoSheet(cyc(), null);
ACT.editContrato = el => { const x = byId(cyc().contratos || [], el.dataset.id); if (x) contratoSheet(cyc(), x); };
CHG.fb = el => { S.feedback = S.feedback || {}; S.feedback[el.dataset.k] = el.value; save(); };
ACT.copyFb = () => {
  const f = S.feedback || {}, t = FB.map(([id, l]) => l + '\n' + (f[id] || '(sin respuesta)')).join('\n\n');
  copyText('Comentarios sobre Surco\n\n' + t, 'Comentarios copiados. Pégalos en WhatsApp.');
};


ACT.toggleCat = el => { const c = cyc(); c.catOff = c.catOff || {}; c.catOff[el.dataset.id] = !c.catOff[el.dataset.id]; commit(); };
ACT.loadTasks = () => { const c = cyc(); c.tasks = newTasks(c.cultivo, c.fechaSiembra, {riego: c.riego, semilla: c.semilla}); commit(); toast('Calendario sugerido cargado'); };

function prodSheet(p) {
  openSheet({
    title: p ? 'Producto' : 'Nuevo producto',
    fields: [
      {k: 'nombre', l: 'Nombre comercial', req: 1, w: 'full'}, {k: 'tipo', l: 'Tipo', t: 'sel', o: PROD_TIPOS.map(x => [x, x])}, {k: 'ia', l: 'Ingrediente activo'},
      {k: 'unidad', l: 'Se mide en', t: 'sel', o: [['lt', 'Litros'], ['kg', 'Kilos'], ['ton', 'Toneladas'], ['pza', 'Piezas']]},
      {k: 'existencia', l: 'Cuánto tienes', t: 'num', req: 1}, {k: 'costoU', l: 'Costo por unidad', t: 'num', u: '$'}, {k: 'minimo', l: 'Avisar cuando quede', t: 'num', h: 'Opcional: la cantidad mínima que no quieres bajar.'},
      {k: 'carencia', l: 'Carencia', t: 'num', u: 'días', h: 'De la etiqueta. Se usa para llenar sola la bitácora.'}, {k: 'caduca', l: 'Caducidad', t: 'date'},
      {k: 'prov', l: 'Proveedor'}, {k: 'nota', l: 'Nota', t: 'area', w: 'full'}
    ],
    values: p ? {...p} : {nombre: '', tipo: 'Fungicida', ia: '', unidad: 'lt', existencia: '', costoU: '', minimo: '', carencia: '', caduca: '', prov: '', nota: ''},
    calc: v => v.existencia > 0 && v.costoU > 0 ? `Valor en bodega: <b>${money(v.existencia * v.costoU)}</b>.` : '',
    onSave(v) { const o = p || {id: uid()}; Object.assign(o, v); S.inv = S.inv || []; if (!p) S.inv.push(o); },
    onDelete: p ? () => { S.inv = S.inv.filter(x => x !== p); } : null
  });
}
ACT.addProd = () => prodSheet(null);
ACT.editProd = el => { const p = byId(S.inv || [], el.dataset.id); if (p) prodSheet(p); };
ACT.movProd = el => {
  const p = byId(S.inv || [], el.dataset.id), c = cyc(); if (!p) return;
  openSheet({
    title: p.nombre, saveLabel: 'Registrar', intro: `Ahora tienes <b>${fmtN(p.existencia, 1)} ${esc(p.unidad)}</b>.`,
    fields: [
      {k: 'tipo', l: 'Qué pasó', t: 'sel', w: 'full', o: [['compra', 'Compré (entra al almacén)'], ['uso', 'Usé o se gastó (sale)'], ['ajuste', 'Contar de nuevo: esto es lo que hay']]},
      {k: 'cant', l: 'Cantidad', t: 'num', req: 1, u: p.unidad}, {k: 'costoU', l: 'Costo por unidad de esta compra', t: 'num', u: '$', h: 'Solo en compras. Se promedia con lo que ya tenías.'},
      {k: 'fecha', l: 'Fecha', t: 'date'}, {k: 'gasto', l: 'Si es compra, anotarla también en Gastos', t: 'chk'}
    ],
    values: {tipo: 'compra', cant: '', costoU: p.costoU || '', fecha: todayISO(), gasto: !!c},
    calc: v => { const n = v.tipo === 'compra' ? p.existencia + v.cant : v.tipo === 'uso' ? p.existencia - v.cant : v.cant; return `Quedarían <b>${fmtN(n, 1)} ${esc(p.unidad)}</b>${n < 0 ? ' <span class="neg">(no puede ser negativo)</span>' : ''}.`; },
    onSave(v) {
      if (!(v.cant >= 0)) return sheetErr('Falta la cantidad.');
      if (v.tipo === 'uso') { if (v.cant > p.existencia) return sheetErr('No tienes tanto en el almacén.'); p.existencia -= v.cant; }
      else if (v.tipo === 'ajuste') p.existencia = v.cant;
      else {
        if (v.costoU > 0) p.costoU = (p.existencia * (p.costoU || v.costoU) + v.cant * v.costoU) / ((p.existencia + v.cant) || 1);
        p.existencia += v.cant;
        if (v.gasto && c && v.costoU > 0) c.gastos.push({id: uid(), fecha: v.fecha || todayISO(), cap: /fertiliz|nutri/i.test(p.tipo) ? 'fert' : p.tipo === 'Tratamiento de semilla' ? 'siembra' : 'plagas', concepto: 'Compra: ' + p.nombre, monto: Math.round(v.cant * v.costoU), proveedor: p.prov || ''});
      }
    }
  });
};

/* ====================== ARRANQUE ====================== */
function init() {
  S = loadState();
  if (!S) S = {v: 1, cycles: [], activeId: null, inv: [], ui: {}};
  S.ui = Object.assign({tab: 'hoy', sub: {}, theme: 'auto', seed: 7, bitFilter: 'todo'}, S.ui || {});
  S.ui.sub = S.ui.sub || {};
  if (!S.cycles.find(c => c.id === S.activeId)) S.activeId = S.cycles[0] ? S.cycles[0].id : null;
  applyTheme();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const f = ACT[el.dataset.a]; if (f) { if (el.tagName === 'A') e.preventDefault(); f(el, e); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && CHG[el.dataset.c]) CHG[el.dataset.c](el, e); });
  document.addEventListener('input', e => { const b = e.target.closest && e.target.closest('.calcbox'); if (b) runCalc(b); }, true);
  addEventListener('pagehide', () => { if (saveT) flush(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) flush(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && SH) closeSheet(); });
  render({top: true});
}
init();
